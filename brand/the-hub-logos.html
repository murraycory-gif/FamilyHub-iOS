<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HUB — logo options</title>
  <style>
    :root {
      --blue: #266BF2;
      --deep: #1447B8;
      --paper: #F5F7FC;
      --ink: #141928;
      --muted: #616B80;
      --red: #DC2626;
      --amber: #D97706;
      --green: #059669;
      --navy: #0B1220;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: #e8ecf3;
      color: var(--ink);
      padding: 40px 32px 80px;
    }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.4px; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px 20px 16px;
      box-shadow: 0 10px 30px rgba(20, 25, 40, 0.06);
    }
    .card.wide { grid-column: span 2; }
    .label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .stage {
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      padding: 28px;
    }
    .stage.paper { background: var(--paper); }
    .stage.navy { background: var(--navy); }
    svg { display: block; }
  </style>
</head>
<body>
  <h1>HUB — logo options</h1>
  <p class="sub">Official name: HUB. Same palette as the app. Pick one and we cut iOS icon sizes next.</p>

  <div class="grid">
    <div class="card">
      <div class="label">A · Node H</div>
      <div class="stage paper">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <path d="M58 36h28v56h48V36h28v136h-28v-56H86v56H58z" fill="#266BF2"/>
          <circle cx="72" cy="36" r="10" fill="#1447B8"/>
          <circle cx="148" cy="36" r="10" fill="#1447B8"/>
          <circle cx="72" cy="172" r="10" fill="#1447B8"/>
          <circle cx="148" cy="172" r="10" fill="#1447B8"/>
          <circle cx="110" cy="92" r="11" fill="#0B1220"/>
          <circle cx="110" cy="92" r="6" fill="#266BF2"/>
          <circle cx="46" cy="92" r="5" fill="#DC2626"/>
          <circle cx="174" cy="92" r="5" fill="#059669"/>
          <circle cx="110" cy="22" r="5" fill="#D97706"/>
          <text x="110" y="208" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="6" fill="#141928">HUB</text>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="label">B · Stamp</div>
      <div class="stage paper">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="96" fill="none" stroke="#266BF2" stroke-width="10"/>
          <circle cx="110" cy="110" r="82" fill="none" stroke="#141928" stroke-width="2"/>
          <path d="M74 58h24v38h24V58h24v96h-24v-38H98v38H74z" fill="#266BF2"/>
          <path d="M86 48 L110 32 L134 48" fill="none" stroke="#1447B8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
          <text x="110" y="184" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#141928">HUB</text>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="label">C · App icon</div>
      <div class="stage paper">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1447B8"/>
              <stop offset="1" stop-color="#266BF2"/>
            </linearGradient>
          </defs>
          <rect x="18" y="18" width="184" height="184" rx="44" fill="url(#g)"/>
          <path d="M68 58h28v42h28V58h28v104h-28v-42H96v42H68z" fill="white"/>
          <circle cx="110" cy="100" r="8" fill="#0B1220"/>
          <circle cx="110" cy="100" r="4" fill="white"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="label">D · Command hex</div>
      <div class="stage navy">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <polygon points="110,24 176,62 176,138 110,176 44,138 44,62" fill="none" stroke="#266BF2" stroke-width="8"/>
          <path d="M80 68h22v30h16V68h22v76h-22v-30h-16v30H80z" fill="#266BF2"/>
          <circle cx="110" cy="24" r="6" fill="#266BF2"/>
          <circle cx="176" cy="62" r="6" fill="#DC2626"/>
          <circle cx="176" cy="138" r="6" fill="#D97706"/>
          <circle cx="44" cy="138" r="6" fill="#059669"/>
          <circle cx="44" cy="62" r="6" fill="#266BF2"/>
          <text x="110" y="208" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="white">HUB</text>
        </svg>
      </div>
    </div>

    <div class="card wide">
      <div class="label">E · Wordmark lockup</div>
      <div class="stage paper" style="min-height:200px">
        <svg width="520" height="160" viewBox="0 0 520 160">
          <rect x="8" y="24" width="112" height="112" rx="22" fill="#266BF2"/>
          <path d="M36 48h20v26h20V48h20v64H76V86H56v26H36z" fill="white"/>
          <text x="144" y="118" font-family="Avenir Next, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#141928">HUB</text>
          <rect x="148" y="132" width="70" height="6" fill="#266BF2"/>
          <rect x="220" y="132" width="28" height="6" fill="#DC2626"/>
          <rect x="250" y="132" width="28" height="6" fill="#D97706"/>
          <rect x="280" y="132" width="28" height="6" fill="#059669"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="label">F · Slash H</div>
      <div class="stage paper">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <path d="M52 30h30v140H52z" fill="#141928"/>
          <path d="M138 30h30v140h-30z" fill="#141928"/>
          <path d="M48 112 L172 72" stroke="#266BF2" stroke-width="22" stroke-linecap="square"/>
          <text x="110" y="208" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="6" fill="#141928">HUB</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
